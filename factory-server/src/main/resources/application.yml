# Every value can be overridden with an environment variable, for example FACTORY_DB_URL or FACTORY_MODEL_BASE_URL.
server:
  port: ${FACTORY_PORT:8080}
  # Address the factory listens on. Behind Oracle HTTP Server (or another proxy) on the same machine, use 127.0.0.1.
  address: ${FACTORY_BIND_ADDRESS:0.0.0.0}
  # Trust X-Forwarded-Host/-Proto/-Prefix from the proxy in front (Oracle HTTP Server), so redirects and single sign-on URLs
  # use the address users see. Only enable this when the factory is reachable through the proxy alone.
  forward-headers-strategy: ${FACTORY_FORWARD_HEADERS:none}
  tomcat:
    # Redirects like /factory to /factory/ are sent as paths, so browsers keep the proxy's https address.
    use-relative-redirects: true
  servlet:
    # Path the factory is served under, for example /factory behind Oracle HTTP Server; empty for the root.
    context-path: ${FACTORY_CONTEXT_PATH:}
    session:
      # Signed-in sessions end after this much inactivity.
      timeout: ${FACTORY_SESSION_TIMEOUT:30m}
      cookie:
        http-only: true
        # lax by default; SAML sign-in needs none (with secure: true), because the identity provider posts back cross-site.
        same-site: ${FACTORY_COOKIE_SAME_SITE:lax}
        # Set to true when the factory is served over HTTPS (it should be in production).
        secure: ${FACTORY_COOKIE_SECURE:false}

spring:
  application:
    name: obdx-development-factory
  datasource:
    url: ${FACTORY_DB_URL:jdbc:postgresql://localhost:5432/factory}
    username: ${FACTORY_DB_USER:factory}
    password: ${FACTORY_DB_PASSWORD:factory}
  servlet:
    multipart:
      # Large enough for OBDX manuals uploaded to the knowledge base (requirement documents are much smaller)
      max-file-size: 150MB
      max-request-size: 151MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration

factory:
  auth:
    # local (accounts in the factory), ldap (bank directory), oidc or saml (single sign-on)
    mode: ${FACTORY_AUTH_MODE:local}
    # Comma-separated usernames that are always administrators (for directory or SSO sign-in)
    admin-users: ${FACTORY_ADMIN_USERS:}
    # Password of the first local "admin" account; if empty, a random one is written to the log once
    initial-admin-password: ${FACTORY_ADMIN_PASSWORD:}
    ldap:
      url: ${FACTORY_LDAP_URL:}
      user-search-base: ${FACTORY_LDAP_USER_SEARCH_BASE:}
      user-search-filter: ${FACTORY_LDAP_USER_SEARCH_FILTER:(uid={0})}
      manager-dn: ${FACTORY_LDAP_MANAGER_DN:}
      manager-password: ${FACTORY_LDAP_MANAGER_PASSWORD:}
    oidc:
      registration-id: sso
      username-claim: ${FACTORY_OIDC_USERNAME_CLAIM:preferred_username}
    saml:
      registration-id: sso
      # Attribute used as the factory username; empty uses the assertion's NameID.
      username-attribute: ${FACTORY_SAML_USERNAME_ATTRIBUTE:}
      display-name-attribute: ${FACTORY_SAML_DISPLAY_NAME_ATTRIBUTE:http://schemas.xmlsoap.org/ws/2005/05/identity/claims/name}
      email-attribute: ${FACTORY_SAML_EMAIL_ATTRIBUTE:http://schemas.xmlsoap.org/ws/2005/05/identity/claims/emailaddress}
  security:
    # 32 random bytes, base64 (openssl rand -base64 32). Encrypts stored SVN passwords. Keep it secret and stable.
    secret-key: ${FACTORY_SECRET_KEY:}
  storage:
    root: ${FACTORY_DATA_DIR:data}
  knowledge:
    # The knowledge base (manual excerpts, the bank's documents, notes) is sent only to model servers on the bank's
    # network: this computer, private addresses, or the hosts below. true also allows servers outside it.
    external-models: ${FACTORY_KNOWLEDGE_EXTERNAL_MODELS:false}
    # Comma-separated model server hosts that belong to the bank but resolve to public addresses (llm.bank.com, .bank.com)
    internal-hosts: ${FACTORY_KNOWLEDGE_INTERNAL_HOSTS:}
    # What goes with a question. Sized for a model with a 4k-token context; raise them for larger models.
    answer-sources: ${FACTORY_KNOWLEDGE_ANSWER_SOURCES:5}
    source-chars: ${FACTORY_KNOWLEDGE_SOURCE_CHARS:1000}
    page-context-chars: ${FACTORY_KNOWLEDGE_PAGE_CONTEXT_CHARS:3000}
    # How often the folders documents were imported from are checked for new and changed files (ISO-8601 duration)
    folder-check-interval: ${FACTORY_KNOWLEDGE_FOLDER_CHECK_INTERVAL:PT6H}
  trial-database:
    # true: the factory starts its own PostgreSQL (data in FACTORY_DATA_DIR/trial-database) and ignores FACTORY_DB_*.
    # For trying the factory on a laptop or test server; for shared use, use a PostgreSQL server with pgvector.
    enabled: ${FACTORY_TRIAL_DATABASE:false}
    directory: ${factory.storage.root}/trial-database
    # Demo SVN repositories made by create-demo-svn; they are added as workspaces and imported at startup.
    demo-svn: ${FACTORY_DEMO_SVN_DIR:demo-svn}
  update:
    # true: check GitHub for newer builds and install them on request (Update now). Only for the download's start
    # scripts (start.bat, start.sh), which start the factory again after an update; they set it in settings.properties.
    enabled: ${FACTORY_UPDATES:false}
    # Where every build publishes obdx-factory.jar and version.json
    url: ${FACTORY_UPDATE_URL:https://github.com/Ramm24Jadhav/OBDX-Development-Factory/releases/download/latest/}
    directory: update
  local-folders:
    # Offer folders on the computer the factory runs on as workspace sources (an SVN checkout, an SVN repository or a
    # plain folder). On by default with the trial database, where that computer is the user's own; on a shared server
    # administrators would see the server's folders, so it is off there unless turned on.
    enabled: ${FACTORY_LOCAL_FOLDERS:${FACTORY_TRIAL_DATABASE:false}}
  svn:
    command: ${FACTORY_SVN_COMMAND:svn}
    trust-unknown-ca: ${FACTORY_SVN_TRUST_UNKNOWN_CA:false}
  indexing:
    embeddings-enabled: ${FACTORY_INDEX_EMBEDDINGS:true}
  jenkins:
    poll-interval: ${FACTORY_JENKINS_POLL_INTERVAL:10s}
    build-timeout: ${FACTORY_JENKINS_BUILD_TIMEOUT:60m}
    # Times the model may fix build errors in the change's files before a developer takes over.
    max-fix-rounds: ${FACTORY_JENKINS_MAX_FIX_ROUNDS:2}
  packs:
    # Optional folder with the team's own version pack files (common.yml, 22.x.yml, 25.x.yml); read at startup.
    dir: ${FACTORY_PACKS_DIR:}
  change:
    # Delivery branches are created here, relative to the SVN repository root.
    branch-folder: ${FACTORY_CHANGE_BRANCH_FOLDER:branches/factory}
    # When to remove delivery branches that were merged (Spring cron: second minute hour day month weekday; "-" = off).
    branch-cleanup: ${FACTORY_BRANCH_CLEANUP:0 17 2 * * *}
  requirements:
    # Long documents go to the model in sections of this size; lower it for models with a small context window.
    max-chars-per-call: ${FACTORY_REQUIREMENTS_MAX_CHARS:12000}
  model:
    base-url: ${FACTORY_MODEL_BASE_URL:http://localhost:11434/v1}
    api-key: ${FACTORY_MODEL_API_KEY:not-needed}
    chat-model: ${FACTORY_MODEL_CHAT:qwen2.5-coder:7b}
    embedding-model: ${FACTORY_MODEL_EMBEDDING:nomic-embed-text}
    timeout: ${FACTORY_MODEL_TIMEOUT:120s}
    # Empty: the embedding model is on base-url. Set to use another server for code search.
    embedding-base-url: ${FACTORY_MODEL_EMBEDDING_BASE_URL:}
    embedding-api-key: ${FACTORY_MODEL_EMBEDDING_API_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
