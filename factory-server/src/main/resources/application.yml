# Every value can be overridden with an environment variable, for example FACTORY_DB_URL or FACTORY_MODEL_BASE_URL.
server:
  port: ${FACTORY_PORT:8080}
  servlet:
    session:
      # Signed-in sessions end after this much inactivity.
      timeout: ${FACTORY_SESSION_TIMEOUT:30m}
      cookie:
        http-only: true
        same-site: lax
        # Set to true when the factory is served over HTTPS (it should be in production).
        secure: ${FACTORY_COOKIE_SECURE:false}

spring:
  application:
    name: obdx-development-factory
  datasource:
    url: ${FACTORY_DB_URL:jdbc:postgresql://localhost:5432/factory}
    username: ${FACTORY_DB_USER:factory}
    password: ${FACTORY_DB_PASSWORD:factory}
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 26MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration

factory:
  auth:
    # local (accounts in the factory), ldap (bank directory) or oidc (single sign-on)
    mode: ${FACTORY_AUTH_MODE:local}
    # Comma-separated usernames that are always administrators (for directory or SSO sign-in)
    admin-users: ${FACTORY_ADMIN_USERS:}
    # Password of the first local "admin" account; if empty, a random one is written to the log once
    initial-admin-password: ${FACTORY_ADMIN_PASSWORD:}
    ldap:
      url: ${FACTORY_LDAP_URL:}
      user-search-base: ${FACTORY_LDAP_USER_SEARCH_BASE:}
      user-search-filter: ${FACTORY_LDAP_USER_SEARCH_FILTER:(uid={0})}
      manager-dn: ${FACTORY_LDAP_MANAGER_DN:}
      manager-password: ${FACTORY_LDAP_MANAGER_PASSWORD:}
    oidc:
      registration-id: sso
      username-claim: ${FACTORY_OIDC_USERNAME_CLAIM:preferred_username}
  security:
    # 32 random bytes, base64 (openssl rand -base64 32). Encrypts stored SVN passwords. Keep it secret and stable.
    secret-key: ${FACTORY_SECRET_KEY:}
  storage:
    root: ${FACTORY_DATA_DIR:data}
  svn:
    command: ${FACTORY_SVN_COMMAND:svn}
    trust-unknown-ca: ${FACTORY_SVN_TRUST_UNKNOWN_CA:false}
  indexing:
    embeddings-enabled: ${FACTORY_INDEX_EMBEDDINGS:true}
  jenkins:
    poll-interval: ${FACTORY_JENKINS_POLL_INTERVAL:10s}
    build-timeout: ${FACTORY_JENKINS_BUILD_TIMEOUT:60m}
    # Times the model may fix build errors in the change's files before a developer takes over.
    max-fix-rounds: ${FACTORY_JENKINS_MAX_FIX_ROUNDS:2}
  change:
    # Delivery branches are created here, relative to the SVN repository root.
    branch-folder: ${FACTORY_CHANGE_BRANCH_FOLDER:branches/factory}
  requirements:
    # Long documents go to the model in sections of this size; lower it for models with a small context window.
    max-chars-per-call: ${FACTORY_REQUIREMENTS_MAX_CHARS:12000}
  model:
    base-url: ${FACTORY_MODEL_BASE_URL:http://localhost:11434/v1}
    api-key: ${FACTORY_MODEL_API_KEY:not-needed}
    chat-model: ${FACTORY_MODEL_CHAT:qwen2.5-coder:7b}
    embedding-model: ${FACTORY_MODEL_EMBEDDING:nomic-embed-text}
    timeout: ${FACTORY_MODEL_TIMEOUT:120s}

management:
  endpoints:
    web:
      exposure:
        include: health,info
