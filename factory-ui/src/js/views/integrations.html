<div class="factory-pg factory-in">
  <div class="factory-pg-head">
    <div>
      <h1>Integrations</h1>
      <p>Everything the factory connects to. Health comes from tests, imports, builds and sign-ins it recorded, never from saved settings alone.</p>
    </div>
    <oj-bind-if test="[[canTestAll()]]">
      <div class="factory-pg-actions"><button type="button" id="testAllIntegrations" :class="[[testing() ? 'fx-btn fx-btn--primary is-loading' : 'fx-btn fx-btn--primary']]" :disabled="[[testing]]" on-click="[[testAll]]">
        <span class="factory-nav-icon factory-ico-refresh factory-btn-icon" aria-hidden="true"></span>Test all</button></div>
    </oj-bind-if>
  </div>

  <oj-bind-if test="[[errorMessage()]]"><div class="fx-alert fx-alert--danger factory-in-alert" id="integrationsError" role="alert"><span class="factory-nav-icon factory-ico-alert" aria-hidden="true"></span>
    <span class="fx-alert-text"><oj-bind-text value="[[errorMessage]]"></oj-bind-text></span></div></oj-bind-if>
  <oj-bind-if test="[[missingText()]]"><div class="fx-alert fx-alert--warning factory-in-alert" role="status"><span class="factory-nav-icon factory-ico-alert" aria-hidden="true"></span>
    <span class="fx-alert-text"><oj-bind-text value="[[missingText]]"></oj-bind-text></span></div></oj-bind-if>

  <div class="factory-in-toolbar">
    <div class="factory-in-filters" role="group" aria-label="Show" id="integrationFilters">
      <oj-bind-for-each data="[[filters]]" as="f">
        <template><button type="button" class="fx-chip" :id="[[f.data.id]]" :aria-pressed="[[f.data.pressed]]" on-click="[[f.data.pick]]">
          <oj-bind-if test="[[f.data.dot]]"><span :class="[[f.data.dot]]" aria-hidden="true"></span></oj-bind-if><oj-bind-text value="[[f.data.text]]"></oj-bind-text></button></template>
      </oj-bind-for-each>
    </div>
    <span class="fx-control factory-in-search"><span class="factory-nav-icon factory-ico-search fx-control-icon" aria-hidden="true"></span>
      <input type="search" class="fx-input" id="intSearch" placeholder="Search by name, server or workspace" aria-label="Search integrations" on-input="[[searchInput]]"></span>
  </div>

  <div class="factory-in-layout">
    <section class="fx-card factory-in-list" aria-label="Connections">
      <div class="factory-in-cols" aria-hidden="true"><span>Connection</span><span>Health</span><span>Last result</span><span>Action</span></div>
      <div id="integrationList">
        <oj-bind-for-each data="[[groups]]" as="g">
          <template>
            <h2 class="factory-in-group" :id="[[g.data.id]]"><oj-bind-text value="[[g.data.title]]"></oj-bind-text></h2>
            <ul class="factory-in-entries" :aria-labelledby="[[g.data.id]]">
              <oj-bind-for-each data="[[g.data.rows]]" as="r">
                <template><li>
                  <button type="button" :class="[[r.data.css]]" :aria-current="[[r.data.current]]" on-click="[[r.data.pick]]" :aria-label="[[r.data.label]]">
                    <span class="factory-in-name"><span class="factory-in-icon" aria-hidden="true"><span :class="[[g.data.iconClass]]"></span></span>
                      <span class="factory-in-namet"><strong><oj-bind-text value="[[r.data.name]]"></oj-bind-text></strong><span :class="[[r.data.subCss]]" :title="[[r.data.sub]]"><oj-bind-text value="[[r.data.sub]]"></oj-bind-text></span></span></span>
                    <span class="factory-in-health"><span :class="[[r.data.pill.css]]"><span :class="[[r.data.pill.iconCss]]" aria-hidden="true"></span><oj-bind-text value="[[r.data.pill.text]]"></oj-bind-text></span></span>
                    <span class="factory-in-when" :title="[[r.data.lastTitle]]"><oj-bind-text value="[[r.data.lastText]]"></oj-bind-text></span>
                    <span class="factory-in-act" aria-hidden="true"><oj-bind-text value="[[r.data.action]]"></oj-bind-text></span>
                  </button></li></template>
              </oj-bind-for-each>
            </ul>
          </template>
        </oj-bind-for-each>
      </div>
      <oj-bind-if test="[[groups().length === 0]]"><div class="fx-empty"><span class="fx-empty-icon"><span class="factory-nav-icon factory-ico-plug" aria-hidden="true"></span></span><oj-bind-text value="[[emptyText]]"></oj-bind-text></div></oj-bind-if>
    </section>

    <section class="fx-card factory-in-detail" id="integrationDetail" aria-labelledby="integrationTitle">
      <oj-bind-if test="[[!selected()]]"><div class="fx-empty"><span class="fx-empty-icon"><span class="factory-nav-icon factory-ico-plug" aria-hidden="true"></span></span><oj-bind-text value="[[loading() ? 'Loading…' : 'Choose an integration to see its details.']]"></oj-bind-text></div></oj-bind-if>
      <oj-bind-if test="[[selected()]]">
        <div class="factory-in-dhead">
          <span class="factory-in-dname"><span class="factory-in-glabel"><oj-bind-text value="[[detail().group]]"></oj-bind-text></span>
            <h2 class="factory-in-title" id="integrationTitle"><oj-bind-text value="[[selected().name]]"></oj-bind-text></h2></span>
          <span :class="[[selected().pill.css]]"><span :class="[[selected().pill.iconCss]]" aria-hidden="true"></span><oj-bind-text value="[[selected().pill.text]]"></oj-bind-text></span>
        </div>
        <oj-bind-if test="[[selected().note]]"><p class="factory-in-note" id="integrationNote"><oj-bind-text value="[[selected().note]]"></oj-bind-text></p></oj-bind-if>
        <div class="factory-in-btns">
          <oj-bind-if test="[[detail().primaryTest]]">
            <button type="button" id="testIntegrationButton" :class="[[testCss]]" on-click="[[testSelected]]" :disabled="[[testing()]]">
              <span class="factory-nav-icon factory-ico-refresh" aria-hidden="true"></span><oj-bind-text value="[[detail().testLabel]]"></oj-bind-text></button>
          </oj-bind-if>
          <oj-bind-if test="[[detail().primaryOpen]]">
            <button type="button" id="setUpIntegrationButton" class="fx-btn fx-btn--primary fx-btn--sm" on-click="[[openPrimary]]">
              <span class="factory-nav-icon factory-ico-cog" aria-hidden="true"></span><oj-bind-text value="[[detail().primaryLabel]]"></oj-bind-text></button>
          </oj-bind-if>
          <oj-bind-if test="[[detail().secondaryLabel]]">
            <button type="button" id="openIntegrationSettings" class="fx-btn fx-btn--secondary fx-btn--sm" on-click="[[openSecondary]]"><oj-bind-text value="[[detail().secondaryLabel]]"></oj-bind-text></button>
          </oj-bind-if>
          <oj-bind-if test="[[!selected().canTest && selected().testNote]]"><span class="factory-in-sub factory-in-testnote"><oj-bind-text value="[[selected().testNote]]"></oj-bind-text></span></oj-bind-if>
        </div>

        <div class="fx-tabs factory-in-dtabs" role="tablist" aria-label="Integration details" on-keydown="[[tabKey]]">
          <oj-bind-for-each data="[[detailTabs]]" as="d">
            <template><button type="button" role="tab" :id="[[d.data.id]]" :aria-selected="[[d.data.selected() ? 'true' : 'false']]" :tabindex="[[d.data.selected() ? '0' : '-1']]"
                              aria-controls="integrationPanel" on-click="[[d.data.pick]]"><oj-bind-text value="[[d.data.text]]"></oj-bind-text></button></template>
          </oj-bind-for-each>
        </div>
        <div class="factory-in-panel" id="integrationPanel" role="tabpanel" :aria-labelledby="[['in-tab-' + detailTab()]]">
          <oj-bind-if test="[[detailTab() === 'connection']]">
            <dl class="factory-in-kv" id="integrationFacts"><oj-bind-for-each data="[[selected().facts]]" as="c"><template><dt><oj-bind-text value="[[c.data.k]]"></oj-bind-text></dt><dd><oj-bind-text value="[[c.data.v]]"></oj-bind-text></dd></template></oj-bind-for-each>
              <oj-bind-if test="[[selected().members.length]]"><dt>Last error</dt><dd><oj-bind-text value="[[detail().lastError || 'None recorded']]"></oj-bind-text></dd></oj-bind-if></dl>
            <oj-bind-if test="[[selected().where]]"><p class="factory-in-sub factory-in-where"><oj-bind-text value="[[selected().where]]"></oj-bind-text></p></oj-bind-if>
          </oj-bind-if>
          <oj-bind-if test="[[detailTab() === 'history']]">
            <oj-bind-if test="[[detail().history.length]]">
              <ol class="factory-in-hist" id="integrationHistory"><oj-bind-for-each data="[[detail().history]]" as="h"><template><li :title="[[h.data.title]]"><span :class="[[h.data.dot]]" aria-hidden="true"></span>
                <span class="factory-in-htext"><oj-bind-text value="[[h.data.text]]"></oj-bind-text><oj-bind-if test="[[h.data.when || h.data.meta]]"><span class="factory-in-sub"><oj-bind-text value="[[h.data.when + (h.data.when && h.data.meta ? ' · ' : '') + h.data.meta]]"></oj-bind-text></span></oj-bind-if></span></li></template></oj-bind-for-each></ol>
            </oj-bind-if>
            <oj-bind-if test="[[!detail().history.length]]"><p class="factory-empty">Nothing recorded yet.</p></oj-bind-if>
          </oj-bind-if>
          <oj-bind-if test="[[detailTab() === 'used']]">
            <p class="factory-in-sub">These workspaces use this server, each with its own settings and login.</p>
            <ul class="factory-in-ws" id="integrationWorkspaces"><oj-bind-for-each data="[[detail().usedBy]]" as="w"><template><li>
              <span class="factory-in-htext"><strong><oj-bind-text value="[[w.data.name]]"></oj-bind-text></strong><span class="factory-in-sub"><oj-bind-text value="[[w.data.success]]"></oj-bind-text></span></span>
              <span :class="[[w.data.pill.css]]"><span :class="[[w.data.pill.iconCss]]" aria-hidden="true"></span><oj-bind-text value="[[w.data.pill.text]]"></oj-bind-text></span>
              <span class="factory-in-wsacts">
                <oj-bind-if test="[[w.data.canTest]]"><button type="button" class="fx-btn fx-btn--ghost fx-btn--sm" :aria-label="[[w.data.testLabel]]" :disabled="[[testing()]]" on-click="[[w.data.test]]">Test</button></oj-bind-if>
                <button type="button" class="fx-btn fx-btn--ghost fx-btn--sm" :aria-label="[[w.data.settingsLabel]]" on-click="[[w.data.settings]]">Settings</button></span>
            </li></template></oj-bind-for-each></ul>
          </oj-bind-if>
        </div>
      </oj-bind-if>
    </section>
  </div>
</div>
