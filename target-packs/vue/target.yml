# Vue 3 target pack: a new web app (Vite, Vue 3, TypeScript) on the bank's OBDX REST services.
id: vue
title: Vue 3 (web)
description: A new web app built with Vue 3 and Vite (TypeScript, single-file components) that calls the bank's OBDX REST services.
# The Design Studio shows the screen in its React preview (the same layout and classes); Vue renders the same markup
preview: react
defaultAppFolder: web-vue
# Screens are single-file components: <script setup lang="ts"> and a <template>
syntax: vue

# Where files go, relative to the app folder. {module} is a lowercase module folder (for example payments),
# {Screen} the screen name in PascalCase (FundTransfer), {screenKey} the same in camelCase (fundTransfer).
structure:
  screen: src/screens/{module}/{Screen}Page.vue
  test: src/screens/{module}/__tests__/{Screen}Page.spec.ts
  api: src/api/{module}Api.ts
  texts: src/i18n/en.json
  navigation: src/router/index.ts

# Screen Model component type -> starter component (src/components). value: string, list (string[]), boolean or number.
components:
  text: {component: TextField, value: string}
  textarea: {component: TextArea, value: string}
  number: {component: NumberField, value: number}
  amount: {component: AmountField, value: number}
  date: {component: DateField, value: string}
  select: {component: SelectField, value: string, options: true}
  account: {component: AccountField, value: string, options: true}
  radio: {component: RadioGroup, value: string, options: true}
  checkbox: {component: CheckboxGroup, value: list, options: true}
  switch: {component: SwitchField, value: boolean}
  display: {component: ReadOnlyField, value: string}
  # No table or OBDX JET components in this app yet: shown read-only until the screen is completed
  table: {component: ReadOnlyField, value: string}
  component: {component: ReadOnlyField, value: string}

templates:
  screen: templates/screen.vue
  test: templates/screen.spec.ts

guidance: |
  - This is a Vue 3 web app (Vite, TypeScript, single-file components with <script setup lang="ts">) in its own folder;
    it calls the bank's OBDX REST services. Do not change the OBDX JET UI for it.
  - Build pages only from the components in src/components (TextField, TextArea, NumberField, AmountField, DateField,
    SelectField, AccountField, RadioGroup, CheckboxGroup, SwitchField, ReadOnlyField, Button, Section, Screen). Fields
    take v-model and testID, label, error, required, readOnly, helpText, placeholder, maxLength (and options); Button
    takes testID, label, variant, disabled and emits press. Style with the classes in components.css and its CSS
    variables, not inline colours.
  - Every field and action of the approved Screen Model keeps its Screen Model id as testID (rendered as data-testid).
  - Keep form state and validation in useForm (src/forms/useForm): rules for required and maxLength, check() for the
    spec's other validations; bind fields with v-model="form.values.name" and :error="form.errors.name".
  - All visible texts come from src/i18n/en.json through t('screenKey.name'); add the page's texts there.
  - Call OBDX services only through src/api (api.get/post from client.ts) in a <module>Api.ts file with typed request
    and response types; the client sends the session cookie and a nonce with every call that changes something.
  - Pages do not navigate themselves: they emit action(actionId) and done, which src/router/index.ts wires up.
  - Motion comes from the components (the bank's --bx-dur-* tokens; nothing moves under reduced motion); do not add
    animation libraries.
  - Write tests with Vitest and @vue/test-utils.
  - The app's design comes from the factory's component style in src/component-style.json (look, motion, mode, brand;
    style.ts puts obdx-look-* on the root, components/looks.css draws the nine designs, Liquid glass included). Do not
    style a page for one design: use the components and their classes, and every design applies.

rules:
  - id: vue-no-v-html
    title: No raw HTML
    severity: error
    files: ["**/*.vue"]
    forbid: '\bv-html\b|\binnerHTML\b'
    message: Do not insert raw HTML (it opens the app to script injection); render texts and components instead.
  - id: vue-script-setup-ts
    title: Typed single-file components
    severity: error
    files: ["**/src/**/*.vue"]
    forbid: '<script(?![^>]*lang="ts")[^>]*>'
    message: Write components with <script setup lang="ts"> so they are typed like the rest of the app.
  - id: vue-no-options-api
    title: Composition API
    severity: warning
    files: ["**/src/**/*.vue"]
    forbid: '\bexport\s+default\s*\{|\bdata\s*\(\)\s*\{'
    message: Use <script setup> and the Composition API (ref, computed, useForm), as the starter does.
  - id: app-no-jet
    title: No Oracle JET in the new app
    severity: error
    files: ["**/*.ts", "**/*.vue"]
    forbid: '''ojs/|\bknockout\b|<oj-'
    message: This is the new app; do not use Oracle JET or Knockout here.
  - id: app-no-other-frameworks
    title: Vue only
    severity: error
    files: ["**/*.ts", "**/*.vue"]
    forbid: 'from\s+[''"](react|react-dom|react-native|@angular/[a-z]+|preact)[''"]'
    message: This is the Vue app; use the components in src/components.
  - id: app-api-through-client
    title: Services through src/api
    severity: error
    files: ["**/*.ts", "**/*.vue"]
    exclude: ["**/src/api/**", "**/__tests__/**", "**/*.spec.*"]
    forbid: '(?<![.\w])fetch\s*\(|\bXMLHttpRequest\b|\baxios\b'
    message: Call OBDX services through src/api (api.get/post in a <module>Api.ts file), not with fetch directly.
  - id: app-no-secrets-in-storage
    title: No secrets in the browser
    severity: error
    files: ["**/*.ts", "**/*.vue"]
    forbid: '(localStorage|sessionStorage)\.setItem\([^)]*(password|token|pin|otp|nonce)'
    message: Do not keep passwords, tokens, PINs or one-time codes in the browser; OBDX keeps the session in its cookie.
  - id: app-texts-from-i18n
    title: Texts from i18n
    severity: warning
    files: ["**/src/screens/**/*.vue"]
    forbid: '>\s*[A-Za-z][^<>{}]*[A-Za-z]\s*</|\s(label|title|placeholder|helpText)="[^"]*[A-Za-z]'
    message: Take visible texts from src/i18n/en.json with t('screenKey.name') so they can be translated.
  - id: app-theme-colors
    title: Colours from the theme
    severity: warning
    files: ["**/src/screens/**/*.vue"]
    forbid: '#[0-9a-fA-F]{6}\b|#[0-9a-fA-F]{3}\b(?![0-9a-fA-F])'
    message: Use the classes and CSS variables of components.css, not literal colour codes, so the design system applies.
  - id: app-no-console
    title: No console logging
    severity: warning
    files: ["**/*.ts", "**/*.vue"]
    exclude: ["**/__tests__/**", "**/*.spec.*"]
    forbid: '\bconsole\.(log|debug|info)\s*\('
    message: Remove console logging from app code.
  - id: app-no-any
    title: Typed code
    severity: warning
    files: ["**/*.ts", "**/*.vue"]
    forbid: ':\s*any\b|\bas\s+any\b'
    message: Use specific types (for example the request and response types of the API file) instead of any.

recipes:
  - id: app-screen
    title: Page in the Vue app
    when: A screen of the requirement is built (or changed) in the Vue web app.
    guidance: |
      - Start from the generated starting point: it already maps every field and action of the approved Screen Model to
        the starter components, with testIDs, texts, required and length rules.
      - Load data (for example the customer's accounts) and send the form through the module's API file.
      - On success emit done; on an ApiError show its message (the failure line above the actions).
    parts:
      - id: screen
        name: Screen
        files: ["**/src/screens/**/*Page.vue"]
        examples: {files: ["**/src/screens/**/*Page.vue"], contains: 'useForm|<Screen'}
      - id: test
        name: Screen test
        files: ["**/src/screens/**/__tests__/*.spec.ts"]
        examples: {files: ["**/src/**/__tests__/*.spec.ts"]}
  - id: app-api
    title: API file for a module
    when: Screens of a module call OBDX REST services.
    guidance: |
      - One file per module in src/api, exporting typed functions (for example transfer(request): Promise<TransferResult>)
        that call api.get/post with the OBDX service path.
      - Declare request and response types with the field names the OBDX service uses.
    parts:
      - id: api
        name: API file
        files: ["**/src/api/*Api.ts"]
        template: templates/api.ts
        examples: {files: ["**/src/api/*Api.ts"]}
  - id: app-texts
    title: Texts and navigation
    when: A screen is added or changed.
    guidance: |
      - en.json: keep all existing texts; add or change only the screen's own block (the generated starting point has it).
      - router/index.ts: add one route for the page; its wrapper turns the page's action and done events into navigation.
    parts:
      - id: texts
        name: Texts (en.json)
        files: ["**/src/i18n/*.json"]
      - id: navigation
        name: Navigation
        files: ["**/src/router/*.ts"]
