android.useAndroidX=true
kotlin.code.style=official
org.gradle.jvmargs=-Xmx2g
# The bank's OBDX address (https), for example https://obdx.bank.example; set it per build type or in local properties
obdx.baseUrl=https://obdx.bank.local
# Certificate pinning (see the README): sha256/... pins of the bank's server keys, comma separated, the current one and
# the next one; and the day (yyyy-mm-dd) after which they are no longer enforced. Empty pins turn pinning off, and a
# release build then fails unless it is given -Pobdx.allowNoPins=true.
obdx.pins=
obdx.pinsExpire=
