# Settings for OBDX Development Factory. Change them here and start the factory again.
# Every setting in docs/DEVELOPMENT.md can be added here, in the same form (NAME=value).

# Port and address. 127.0.0.1: only this computer can open the factory. 0.0.0.0: colleagues can too, at
# http://<this computer's name>:8080/ (Windows may ask to allow Java through the firewall).
FACTORY_PORT=8080
FACTORY_BIND_ADDRESS=127.0.0.1

# Password of the "admin" account, set on the first start only (at least 12 characters). Afterwards change it in the
# factory (menu at the top right).
FACTORY_ADMIN_PASSWORD=Factory-Admin-1

# Trial database: the factory starts its own PostgreSQL, with its data in the data folder. For a shared installation,
# set this to false and point FACTORY_DB_URL, FACTORY_DB_USER and FACTORY_DB_PASSWORD at a PostgreSQL server with pgvector.
FACTORY_TRIAL_DATABASE=true
FACTORY_DATA_DIR=data

# Updates: the factory checks GitHub for newer versions; administrators install them with "Update now" (top of the
# page), and the factory restarts by itself. false: no checks.
FACTORY_UPDATES=true

# Model server for the AI features, for example Ollama on this computer (https://ollama.com):
#   ollama pull qwen2.5-coder:7b   and   ollama pull nomic-embed-text
# Everything except the AI answers works without one.
FACTORY_MODEL_BASE_URL=http://localhost:11434/v1
FACTORY_MODEL_CHAT=qwen2.5-coder:7b
FACTORY_MODEL_EMBEDDING=nomic-embed-text
FACTORY_MODEL_TIMEOUT=300s
