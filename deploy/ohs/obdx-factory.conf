# OBDX Development Factory behind Oracle HTTP Server (OHS), the same way OBDX is published.
#
# Users open https://<OHS host>/factory/ ; OHS terminates HTTPS with the bank's certificate and forwards to the factory
# service (deploy/obdx-factory.service), which plays the part a WebLogic managed server plays for OBDX.
#
# 1. Factory service settings (/etc/obdx-factory/obdx-factory.env):
#      FACTORY_CONTEXT_PATH=/factory
#      FACTORY_FORWARD_HEADERS=native      (trust X-Forwarded-* from proxies on internal addresses)
#      FACTORY_COOKIE_SECURE=true
#      FACTORY_BIND_ADDRESS=127.0.0.1      (when OHS runs on the same machine; otherwise firewall port 8080 to OHS only)
# 2. Copy this file to the OHS instance's moduleconf folder (its *.conf files are included automatically), for example
#      $DOMAIN_HOME/config/fmwconfig/components/OHS/instances/ohs1/moduleconf/obdx-factory.conf
#    and replace factory-host with the factory server's host name (127.0.0.1 on the same machine).
# 3. OHS needs mod_proxy, mod_proxy_http and mod_headers (shipped with OHS; check the LoadModule lines in httpd.conf).
# 4. Restart OHS, open https://<OHS host>/factory/ and sign in.
#
# The same <Location> also works inside a specific <VirtualHost> (for example the HTTPS one in ssl.conf) if the factory
# should only be reachable there.

<IfModule mod_proxy.c>
    <Location /factory>
        # The factory runs under the same path (FACTORY_CONTEXT_PATH=/factory), so nothing is rewritten.
        ProxyPass        http://factory-host:8080/factory timeout=300 keepalive=On
        ProxyPassReverse http://factory-host:8080/factory
        # Keep the host name users typed, so links, redirects and single sign-on URLs point at OHS, not the service.
        ProxyPreserveHost On
        <IfModule mod_headers.c>
            # Tell the factory the original request was HTTPS (OHS terminated it). Use "http" for an HTTP-only listener.
            RequestHeader set X-Forwarded-Proto "https"
        </IfModule>
    </Location>
</IfModule>
