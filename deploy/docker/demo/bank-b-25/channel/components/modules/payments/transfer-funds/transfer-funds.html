<div class="oj-flex">
  <oj-select-single label-hint="[[nls.transfer-funds.fromAccount]]" value="{{fromAccount}}"></oj-select-single>
  <oj-select-single label-hint="[[nls.transfer-funds.toAccount]]" value="{{toAccount}}"></oj-select-single>
  <oj-input-number label-hint="[[nls.transfer-funds.amount]]" value="{{amount}}"></oj-input-number>
  <oj-input-date label-hint="[[nls.transfer-funds.valueDate]]" value="{{valueDate}}"></oj-input-date>
  <oj-input-text label-hint="[[nls.transfer-funds.remarks]]" value="{{remarks}}"></oj-input-text>
  <oj-button on-oj-action="[[next]]">Next</oj-button>
  <oj-button on-oj-action="[[cancel]]">Cancel</oj-button>
</div>
