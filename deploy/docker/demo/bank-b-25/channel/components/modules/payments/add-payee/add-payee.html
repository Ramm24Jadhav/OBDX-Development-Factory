<div class="oj-flex">
  <oj-input-text label-hint="[[nls.add-payee.nickname]]" value="{{nickname}}"></oj-input-text>
  <oj-input-text label-hint="[[nls.add-payee.iban]]" value="{{iban}}"></oj-input-text>
  <oj-input-text label-hint="[[nls.add-payee.bic]]" value="{{bic}}"></oj-input-text>
  <oj-switch label-hint="[[nls.add-payee.favourite]]" value="{{favourite}}"></oj-switch>
  <oj-button on-oj-action="[[next]]">Next</oj-button>
  <oj-button on-oj-action="[[cancel]]">Cancel</oj-button>
</div>
