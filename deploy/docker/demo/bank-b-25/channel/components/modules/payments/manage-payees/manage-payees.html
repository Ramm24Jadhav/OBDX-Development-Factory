<div class="oj-flex">
  <oj-input-text label-hint="[[nls.manage-payees.payeeName]]" value="{{payeeName}}"></oj-input-text>
  <oj-input-text label-hint="[[nls.manage-payees.accountNumber]]" value="{{accountNumber}}"></oj-input-text>
  <oj-select-single label-hint="[[nls.manage-payees.bank]]" value="{{bank}}"></oj-select-single>
  <oj-button on-oj-action="[[next]]">Next</oj-button>
  <oj-button on-oj-action="[[cancel]]">Cancel</oj-button>
</div>
