<div class="oj-flex">
  <oj-input-date label-hint="[[nls.statement-download.fromDate]]" value="{{fromDate}}"></oj-input-date>
  <oj-input-date label-hint="[[nls.statement-download.toDate]]" value="{{toDate}}"></oj-input-date>
  <oj-radioset label-hint="[[nls.statement-download.format]]" value="{{format}}"></oj-radioset>
  <oj-button on-oj-action="[[next]]">Next</oj-button>
  <oj-button on-oj-action="[[cancel]]">Cancel</oj-button>
</div>
