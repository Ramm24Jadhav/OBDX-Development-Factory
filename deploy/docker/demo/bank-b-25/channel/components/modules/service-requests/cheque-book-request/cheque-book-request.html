<div class="oj-flex">
  <oj-select-single label-hint="[[nls.cheque-book-request.account]]" value="{{account}}"></oj-select-single>
  <oj-input-number label-hint="[[nls.cheque-book-request.leaves]]" value="{{leaves}}"></oj-input-number>
  <oj-select-single label-hint="[[nls.cheque-book-request.deliveryBranch]]" value="{{deliveryBranch}}"></oj-select-single>
  <oj-button on-oj-action="[[next]]">Next</oj-button>
  <oj-button on-oj-action="[[cancel]]">Cancel</oj-button>
</div>
